<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>把行銷工作交給 Codex｜學員技能卡</title>
<style>
:root{--white:#fff;--green:#233D1F;--gold:#DCBC87;--goldink:#9A7B3F;--ink:#3A3A3A;
--clay:#A6553C;--fog:#C7D3C8;--line:#E5E0D8;--bg:#FAF9F6}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:400 15px/1.7 "Noto Sans TC","PingFang TC",system-ui,sans-serif;overflow:hidden}
.app{height:100dvh;display:flex}
.side{width:236px;flex:0 0 236px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:16px 0 24px}
.side h2{font-size:15px;margin:0 14px 2px;color:var(--green);line-height:1.4}
.side .sb{font-size:11px;color:#9A9A93;margin:0 14px 12px}
.side .grp{font-size:10.5px;letter-spacing:.1em;color:#A9A9A2;margin:12px 14px 4px}
.side a{display:flex;gap:8px;padding:6px 14px;text-decoration:none;color:var(--ink);font-size:13px;cursor:pointer}
.side a:hover{background:#F2F4F1}
.side a.on{background:#EDF1EC;box-shadow:inset 3px 0 0 var(--green);color:var(--green);font-weight:700}
.side a .n{color:#A9A9A2;font-size:11.5px;min-width:16px}
.side a.soon{opacity:.45}
.main{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:24px;padding:18px 24px 20px;overflow:hidden}
.left{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.head{flex:0 0 auto}
.eyebrow{display:inline-block;font-size:10.5px;letter-spacing:.1em;color:var(--goldink);background:#F7F1E6;border-radius:99px;padding:2px 10px}
h1{font-size:26px;line-height:1.25;margin:7px 0 3px;color:var(--green)}
h1 .n{color:var(--fog);margin-right:9px}
.lead{margin:0;font-size:15px;color:#5C5C56}
.useline{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 0}
.useline div{align-self:start}
.useline div{border-radius:10px;padding:9px 13px;font-size:13px;line-height:1.6}
.useline .no{background:#F6F1EE;border:1px solid #E7D7D0;color:#7A4130}
.useline .yes{background:#EDF1EC;border:1px solid var(--fog);color:var(--green)}
.useline b{display:block;font-size:11.5px;letter-spacing:.06em;margin-bottom:2px;opacity:.85}
.grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0 0}
.cell{position:relative;display:flex;min-height:0}
.cell img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#fff;border:1px solid var(--line)}
.cell .step{position:absolute;top:8px;left:8px;z-index:2;width:20px;height:20px;border-radius:50%;
 background:var(--green);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:20px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cell.pending{align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:#B4B4AD;font-size:12.5px;background:#fff}
.right{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.prep{flex:0 0 auto;font-size:13px;color:#5C5C56;margin:0 0 8px}
.prep b{color:var(--green)}
.copywrap{position:relative;flex:0 0 auto;display:flex}
.copybox{flex:1;border:1px dashed var(--gold);border-radius:12px;background:#FFFDF8;
 padding:42px 18px 18px;white-space:pre-wrap;margin:0;font-size:14.5px;line-height:1.95}
.copybtn{position:absolute;top:10px;right:12px;z-index:2;border:1px solid var(--gold);background:#fff;
 color:var(--goldink);border-radius:8px;padding:5px 13px;font:700 12.5px/1 inherit;cursor:pointer}
.copybtn.done{background:var(--green);border-color:var(--green);color:#fff}
.fill{background:#F0E6D2;color:var(--goldink);border-radius:4px;padding:0 3px;font-weight:700}
.tip{flex:0 0 auto;margin:8px 0 0;font-size:12px;color:#8A8A84}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
th{background:var(--green);color:#fff;font-size:13px}
tr:hover td{background:#F4F6F3}
td a{color:var(--green);font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.tablewrap{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.tablewrap.tside{flex:0 0 auto;margin-top:14px}
.tablewrap .tgrp td{background:#EDF1EC;color:var(--green);font-weight:700;font-size:12px;letter-spacing:.05em;padding:7px 12px}
@media (max-width:1080px),(max-height:620px){
 body{overflow:auto}.app{height:auto;display:block}
 .side{width:auto;flex:none;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:12px}
 .side h2,.side .sb,.side .grp{width:100%}
 .side a{border:1px solid var(--line);border-radius:99px;padding:5px 10px}
 .main{grid-template-columns:1fr;overflow:visible;padding:18px}
 .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}
 .cell img{height:auto;aspect-ratio:1/1}
 .copywrap{display:block}.copybox{overflow:visible}
}
</style></head><body>
<div class="app">
 <nav class="side"><h2>把行銷工作交給 Codex</h2><p class="sb">學員技能卡｜美力時尚診所</p><div id="nav"></div></nav>
 <div class="main" id="main"></div>
</div>
<script src="卡片資料.js?v=20260914h"></script>
<script>
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const mark=s=>esc(s).replace(/【[^】]+】/g,m=>'<span class="fill">'+m+'</span>');
const nav=document.getElementById('nav'), main=document.getElementById('main');
let cur=0, lastGrp='';
CARDS.forEach((c,i)=>{
  if(c.group!==lastGrp){lastGrp=c.group;const g=document.createElement('div');g.className='grp';g.textContent=c.group;nav.appendChild(g);}
  const a=document.createElement('a');
  a.className='item'+(c.ready?'':' soon');
  a.innerHTML='<span class="n">'+c.n+'</span><span>'+esc(c.title)+'</span>';
  a.onclick=()=>show(i); nav.appendChild(a);
});
function show(i){
  cur=i; const c=CARDS[i];
  document.querySelectorAll('.side a').forEach((a,k)=>a.classList.toggle('on',k===i));
  let left='<div class="head"><span class="eyebrow">'+esc(c.group)+'</span>'+
    '<h1><span class="n">'+c.n+'</span>'+esc(c.title)+'</h1>'+
    '<p class="lead">'+esc(c.lead)+'</p></div>';
  const tbl=c.table?'<div class="tablewrap tside"><table><thead><tr><th>我要做的事</th><th>叫哪一顆</th><th></th></tr></thead><tbody>'+
    c.table.map(r=>r.length<3?'<tr class="tgrp"><td colspan="3">'+esc(r[0])+'</td></tr>':'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td><a onclick="jump(\''+r[2]+'\')">看這張卡 →</a></td></tr>').join('')+
    '</tbody></table></div>':'';
  if(c.dir){
    left+='<div class="grid">'+[1,2,3,4,5,6].map(k=>
      '<div class="cell"><span class="step">'+k+'</span><img loading="lazy" decoding="async" src="comics/'+c.dir+'/panel-'+k+'-text.jpg?v=20260914c" onerror="pend(this,'+k+')" alt=""></div>').join('')+'</div>';
  } else if(c.table){
    left+=tbl;
  }
  let right='';
  if(c.code){
    right='<p class="prep"><b>先準備：</b>'+esc(c.prep||'—')+'</p>'+
      '<div class="copywrap"><button class="copybtn" id="cb">複製這段</button>'+
      '<pre class="copybox" id="cx">'+mark(c.code)+'</pre></div>'+
      '<p class="tip">把【】裡面換成你自己的內容再送出。</p>'+
      (c.no?'<div class="useline"><div class="no"><b>沒有它</b>'+esc(c.no)+'</div>'+
        '<div class="yes"><b>有了它</b>'+esc(c.yes)+'</div></div>':'');
  } else if(c.codes){
    right=c.codes.map((b,k)=>'<p class="prep"><b>'+esc(b.label)+'</b></p>'+
      '<div class="copywrap"><button class="copybtn" data-k="'+k+'">複製這段</button>'+
      '<pre class="copybox" id="cx'+k+'">'+mark(b.code)+'</pre></div>').join('')+
      (tbl||'')+
      (c.no?'<div class="useline" style="margin-top:14px"><div class="no"><b>沒有它</b>'+esc(c.no)+'</div>'+
        '<div class="yes"><b>有了它</b>'+esc(c.yes)+'</div></div>':'');
  }
  main.innerHTML='<div class="left">'+left+'</div><div class="right">'+right+'</div>';
}
function jump(n){const i=CARDS.findIndex(c=>c.n===n); if(i>=0) show(i);}
function pend(img,k){const cell=img.parentElement;cell.classList.add('pending');cell.innerHTML='<span class="step">'+k+'</span>製作中';}
document.addEventListener('click',async e=>{
  const b=e.target.closest('.copybtn'); if(!b) return;
  const el=b.dataset.k!==undefined?document.getElementById('cx'+b.dataset.k):document.getElementById('cx');
  let ok=false; try{await navigator.clipboard.writeText(el.innerText);ok=true}catch(_){}
  b.textContent=ok?'已複製':'請手動選取'; b.classList.toggle('done',ok);
  setTimeout(()=>{b.textContent='複製這段';b.classList.remove('done')},1600);
});
show(0);
</script></body></html>
